name: Strategy Backtest Engine

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date'
        required: true
        default: '2026-08-01'
      end_date:
        description: 'End Date'
        required: true
        default: '2026-10-01'

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install alpaca-py pandas numpy
      - name: Run Backtest
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python backtest_engine.py
